# /etc/nginx/sites-available/iob
#
# EDIT server_name before use.
#
# Proxy at the subdomain ROOT, never a subpath. utility/dashboard.py emits
# root-relative URLs only -- redirect("/") and action="/toggle" -- so mounting
# this under e.g. /iob/ would post to /toggle and lose the prefix.
#
# Run `certbot --nginx -d iob.yourdomain.com` after enabling. The dashboard
# uses HTTP Basic auth on every request including the 60s meta-refresh, so on
# plain port 80 the password is base64 on the wire, all day. That password
# gates lot sizes and strategy toggles on a live account.

server {
    listen 80;
    server_name iob.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
